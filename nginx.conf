events {
    worker_connections 1024;
}

http {
    upstream wordcreator {
        server wordcreator:8080;
    }

    server {
        listen 80;
        server_name domen.com www.domen.com;

        # Редирект с HTTP на HTTPS (если нужно)
        # return 301 https://$server_name$request_uri;

        location /wordcreator/ {
            proxy_pass http://wordcreator/wordcreator/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /wordcreator;

            # Важно для WebSocket (Vaadin)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }

        location / {
            # Можно добавить статическую главную страницу или редирект
            return 404;
            # или
            # root /usr/share/nginx/html;
        }
    }

    # Для HTTPS (рекомендуется)
    # server {
    #     listen 443 ssl http2;
    #     server_name domen.com www.domen.com;
    #
    #     ssl_certificate /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
