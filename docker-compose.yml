version: '3.8'

services:
  wordcreator:
    build: .
    container_name: wordcreator-app
    restart: unless-stopped
    environment:
      - SERVER_SERVLET_CONTEXT_PATH=/wordcreator
      - SPRING_PROFILES_ACTIVE=prod
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - wordcreator
    networks:
      - app-network

networks:
  app-network:
    driver: bridge